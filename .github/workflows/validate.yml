name: Validar integração 2D

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BROWSER_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run aircraft2d:check
      - run: npm run cabines
      - run: npm run rotas
      - run: npm run malha
      - run: npm run ai:foundation
      - run: npm run economy:hubs
      - run: npm run economy:regressions
      - run: npm run flights:check
      - run: npm run connections:check
      - run: npm run calendar:check
      - run: npm run save:file:check
      - run: npm run map:geometry
      - run: npm run map:tiles
      - run: npx tsx scripts/cargo-check.ts
      - run: npm run sim -- GRU 1460
      - run: npm run smoke
      - name: Calendário e mapa no celular e desktop
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/calendar-vite.log 2>&1 &
          calendar_pid=$!
          trap 'kill "$calendar_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          npm run calendar:ui
          npm run map:tiles:ui
          npm run save:file:ui
